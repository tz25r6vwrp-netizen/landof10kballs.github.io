<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Land of 10k Balls | Premium Golf Balls</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0a; color: #fff; line-height: 1.6; }
    .header { background: #111; padding: 20px; border-bottom: 1px solid #222; position: sticky; top: 0; z-index: 100; }
    .nav { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 24px; font-weight: 800; color: #4ade80; }
    .cart-btn { background: #4ade80; color: #000; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; }
    .hero { max-width: 1200px; margin: 60px auto; padding: 0 20px; text-align: center; }
    .hero h1 { font-size: 48px; margin-bottom: 16px; }
    .hero p { font-size: 20px; color: #aaa; margin-bottom: 32px; }
    .products { max-width: 1200px; margin: 40px auto; padding: 0 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; }
    .product { background: #111; border: 1px solid #222; border-radius: 12px; overflow: hidden; transition: transform 0.2s; }
    .product:hover { transform: translateY(-4px); border-color: #4ade80; }
    .product-img { width: 100%; height: 200px; background: #1a1a1a; display: flex; align-items: center; justify-content: center; font-size: 64px; }
    .product-info { padding: 20px; }
    .product-name { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
    .product-price { font-size: 24px; color: #4ade80; margin-bottom: 16px; }
    .add-cart { width: 100%; background: #4ade80; color: #000; border: none; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; }
    .add-cart:hover { background: #22c55e; }
    .cart-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; }
    .cart-content { max-width: 500px; margin: 60px auto; background: #111; border-radius: 12px; padding: 24px; max-height: 80vh; overflow-y: auto; }
    .cart-item { display: flex; justify-content: space-between; padding: 16px 0; border-bottom: 1px solid #222; }
    .checkout-btn { width: 100%; background: #4ade80; color: #000; border: none; padding: 16px; border-radius: 8px; font-weight: 700; font-size: 18px; margin-top: 20px; cursor: pointer; }
    .close-cart { float: right; font-size: 28px; cursor: pointer; color: #aaa; }
    @media (max-width: 768px) { .hero h1 { font-size: 32px; } }
  </style>
</head>
<body>
  <header class="header">
    <nav class="nav">
      <div class="logo">LAND OF 10K BALLS</div>
      <button class="cart-btn" onclick="openCart()">Cart (<span id="cart-count">0</span>)</button>
    </nav>
  </header>

  <section class="hero">
    <h1>Premium Golf Balls for Every Golfer</h1>
    <p>Top-tier quality at prices that won't break your budget. Free shipping on orders $50+</p>
  </section>

  <section class="products" id="products"></section>

  <div class="cart-modal" id="cartModal">
    <div class="cart-content">
      <span class="close-cart" onclick="closeCart()">&times;</span>
      <h2>Your Cart</h2>
      <div id="cart-items"></div>
      <div style="margin-top: 20px; padding-top: 20px; border-top: 1px solid #222;">
        <div style="display: flex; justify-content: space-between; font-size: 20px; margin-bottom: 16px;">
          <span>Total:</span>
          <span id="cart-total">$0.00</span>
        </div>
        <button class="checkout-btn" onclick="checkout()">Checkout with Stripe</button>
      </div>
    </div>
  </div>

  <script>
    const products = [
      { id: 1, name: "Pro V1 Lake Balls - Dozen", price: 14.99, emoji: "⛳" },
      { id: 2, name: "TP5 Practice Balls - Dozen", price: 12.99, emoji: "🏌️" },
      { id: 3, name: "Chrome Soft Mix - Dozen", price: 13.99, emoji: "💎" },
      { id: 4, name: "Callaway Mix - Dozen", price: 11.99, emoji: "🏆" },
      { id: 5, name: "Premium Mystery Box - 2 Dozen", price: 9.99, emoji: "📦" }
    ];
    
    let cart = JSON.parse(localStorage.getItem('cart')) || [];
    
    function renderProducts() {
      const container = document.getElementById('products');
      container.innerHTML = products.map(p => `
        <div class="product">
          <div class="product-img">${p.emoji}</div>
          <div class="product-info">
            <div class="product-name">${p.name}</div>
            <div class="product-price">$${p.price}</div>
            <button class="add-cart" onclick="addToCart(${p.id})">Add to Cart</button>
          </div>
        </div>
      `).join('');
    }
    
    function addToCart(id) {
      const product = products.find(p => p.id === id);
      const existing = cart.find(item => item.id === id);
      if (existing) {
        existing.qty++;
      } else {
        cart.push({...product, qty: 1});
      }
      saveCart();
      updateCartCount();
    }
    
    function updateCartCount() {
      const count = cart.reduce((sum, item) => sum + item.qty, 0);
      document.getElementById('cart-count').textContent = count;
    }
    
    function openCart() {
      renderCart();
      document.getElementById('cartModal').style.display = 'block';
    }
    
    function closeCart() {
      document.getElementById('cartModal').style.display = 'none';
    }
    
    function renderCart() {
      const container = document.getElementById('cart-items');
      if (cart.length === 0) {
        container.innerHTML = '<p style="color: #aaa; text-align: center; padding: 40px 0;">Your cart is empty</p>';
        document.getElementById('cart-total').textContent = '$0.00';
        return;
      }
      container.innerHTML = cart.map(item => `
        <div class="cart-item">
          <div>
            <div style="font-weight: 600;">${item.name}</div>
            <div style="color: #aaa;">$${item.price} x ${item.qty}</div>
          </div>
          <div style="text-align: right;">
            <div style="font-weight: 600; margin-bottom: 8px;">$${(item.price * item.qty).toFixed(2)}</div>
            <button onclick="removeFromCart(${item.id})" style="background: #ef4444; color: #fff; border: none; padding: 4px 12px; border-radius: 4px; cursor: pointer;">Remove</button>
          </div>
        </div>
      `).join('');
      const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      document.getElementById('cart-total').textContent = `$${total.toFixed(2)}`;
    }
    
    function removeFromCart(id) {
      cart = cart.filter(item => item.id !== id);
      saveCart();
      updateCartCount();
      renderCart();
    }
    
    function saveCart() {
      localStorage.setItem('cart', JSON.stringify(cart));
    }
    
    function checkout() {
      if (cart.length === 0) return;
      // Replace with your actual Stripe Payment Link
      window.location.href = 'https://buy.stripe.com/test_00g14m6Zk8qv5qE4gg';
    }
    
    renderProducts();
    updateCartCount();
    
    // Close modal when clicking outside
    window.onclick = function(event) {
      if (event.target == document.getElementById('cartModal')) {
        closeCart();
      }
    }
  </script>
</body>
</html>
